name: Release Python distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual publishing target; only TestPyPI is available here."
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG_PREFIX: WQSurrogateModels-v

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'WQSurrogateModels-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "PyPI publication is blocked until the repository is public."
            exit 1
          fi

      - name: Require main for manual TestPyPI runs
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF_NAME" = "main"

      - name: Install locked development and package tooling
        run: uv sync --locked --extra dev --extra package

      - name: Verify release tag and title
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          expected_version="$(uv run --locked python -c 'from wqsurrogatemodels import __version__; print(__version__)')"
          expected_tag="${RELEASE_TAG_PREFIX}${expected_version}"
          expected_name="WQSurrogateModels v${expected_version}"
          test "$RELEASE_TAG" = "$expected_tag"
          test "$RELEASE_NAME" = "$expected_name"

      - name: Run test suite
        run: uv run --locked pytest

      - name: Build wheel and source distribution
        run: uv run --locked --extra package python -m build --outdir dist

      - name: Validate distribution boundary
        run: uv run --locked --extra package python scripts/validate_package.py dist

      - name: Check distribution metadata
        run: uv run --locked --extra package twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wqsurrogatemodels
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'WQSurrogateModels-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wqsurrogatemodels
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
