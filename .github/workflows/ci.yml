name: CI

on:
  push:
    branches: [main]
    tags:
      - "WQSurrogateModels-v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest -q --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: wqsurrogatemodels:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test the Docker API runtime
        run: |
          container_name=wqsurrogatemodels-ci-smoke
          docker run --detach --rm --name "$container_name" --publish 127.0.0.1:18001:8001 wqsurrogatemodels:ci-test
          trap 'docker rm --force "$container_name" || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18001/api/v2/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18001/api/v2/ready
          curl --fail --silent --request POST http://127.0.0.1:18001/api/v2/assessment \
            --header 'Content-Type: application/json' \
            --data '{"DO":96.2,"BOD":1.5,"NH3N":0.22,"EC":171,"SS":2.6,"model_type":"direct_wqi5"}' \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["model_type"] == "direct_wqi5"; assert 0 <= payload["score"] <= 100'

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Verify locked project environment
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Smoke test local API runtime
        run: uv run python scripts/smoke_api.py

  arm64-model-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image with optional model dependencies
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            INSTALL_MODEL_EXTRAS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
