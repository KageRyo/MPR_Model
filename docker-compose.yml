services:
  wq-surrogate-models:
    build:
      context: .
      args:
        INSTALL_MODEL_EXTRAS: ${INSTALL_MODEL_EXTRAS:-false}
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8001}:8001"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${LOCAL_MODEL_DIR:-./models}
        target: /app/models
        read_only: true
      - type: bind
        source: ${LOCAL_DATA_DIR:-./data}
        target: /app/data
        read_only: true
