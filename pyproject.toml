[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wqsurrogatemodels"
dynamic = ["version"]
description = "WQI5-based current-state water quality assessment backend for WaterMirror."
readme = "README-PYPI.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "kageryo", email = "kageryo@coderyo.com" }
]
keywords = ["water quality", "WQI5", "FastAPI", "surrogate models"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi",
  "joblib==1.5.3",
  "loguru",
  "numpy",
  "pandas",
  "python-dotenv",
  "python-multipart",
  "pyyaml",
  "scikit-learn==1.5.2",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "openpyxl>=3.1",
  "pytest>=7.4",
  "httpx>=0.27.0",
  "anyio>=4.0",
]
test = [
  "openpyxl>=3.1",
  "pytest>=7.4",
  "httpx>=0.27.0",
  "anyio>=4.0",
]
models = [
  "lightgbm==4.6.0",
  "xgboost==3.2.0",
]
lightgbm = [
  "lightgbm==4.6.0",
]
xgboost = [
  "xgboost==3.2.0",
]
package = [
  "build>=1.2",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/KageRyo/WQSurrogateModels"
Repository = "https://github.com/KageRyo/WQSurrogateModels"
Issues = "https://github.com/KageRyo/WQSurrogateModels/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "wqsurrogatemodels.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wqsurrogatemodels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -ra"
markers = [
    "anyio: mark test as requiring anyio",
]
